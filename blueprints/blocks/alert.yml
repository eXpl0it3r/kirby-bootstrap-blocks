name: Bootstrap Alert
icon: alert
fields:
  alertType:
    type: toggles
    label: "Alert Type:"
    options:
      primary: Primary
      secondary: Secondary
      success: Success
      danger: Danger
      warning: Warning
      info: Info
      light: Light
      dark: Dark
    required: true
  dismissible:
    type: toggle
    label: "Dismissible?"
  text:
    type: writer
    label: "Alert content"
    marks:
      - bold
      - italic
