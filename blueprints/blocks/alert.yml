name: Bootstrap Alert
icon: alert
fields:
  alertType:
    type: select
    label: "Alert Type:"
    options:
      primary: Primary
      secondary: Secondary
      success: Success
      danger: Danger
      warning: Warning
      info: Info
      light: Light
      dark: Dark
    required: true
    width: 1/2
  dismissible:
    type: toggle
    label: "Dismissible?"
    width: 1/2
  text:
    type: writer
    label: "Alert content"
    marks:
      - bold
      - italic
